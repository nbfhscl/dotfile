services:
  arch-test-all-commands:
    image: archlinux:latest
    container_name: dotfile-test-all-commands
    network_mode: host
    privileged: true
    volumes:
      - ../../:/dotfile:ro
      - ../results:/test-results
    environment:
      - DEBUG=1
    command: >
      bash -c '
        echo "==> Initializing Arch Linux keyring..." &&
        pacman-key --init &&
        pacman-key --populate archlinux &&
        echo "==> Updating package database..." &&
        pacman -Sy --noconfirm --needed &&
        echo "==> Installing required packages..." &&
        pacman -S --noconfirm --needed git curl bash sudo neovim vim zsh nodejs npm ripgrep fzf bat fd eza tmux zoxide &&
        echo "==> Environment ready" &&
        echo "==> Bash: $$(bash --version | head -1)" &&
        echo "==> Git: $$(git --version | head -1)" &&
        echo "==> Curl: $$(curl --version | head -1)" &&
        echo "==> Neovim: $$(nvim --version | head -1)" &&
        echo "==> Vim: $$(vim --version | head -1)" &&
        echo "==> Zsh: $$(zsh --version)" &&
        echo "==> Node: $$(node --version)" &&
        echo "==> NPM: $$(npm --version)" &&
        echo "==> Ripgrep: $$(rg --version)" &&
        echo "==> Fzf: $$(fzf --version)" &&
        echo "" &&
        echo "==> Starting comprehensive command test..." &&
        bash /dotfile/tests/e2e/test-all-commands.sh
      '
