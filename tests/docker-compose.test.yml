# Docker Compose for Dotfile End-to-End Testing
# Usage: docker-compose -f docker-compose.test.yml up --abort-on-container-exit

services:
  arch-test:
    image: archlinux:latest
    container_name: dotfile-test-arch
    hostname: arch-test
    network_mode: host
    stdin_open: true
    tty: true
    command: /bin/bash
    environment:
      - TERM=xterm-256color
      - DOT_DIR=/root/.dotfile
      - DRY_RUN=${DRY_RUN:-}
      - LOCAL_REPO_SRC=/workspace
    volumes:
      # Mount the test script
      - ./docker/run-e2e-test.sh:/usr/local/bin/run-e2e-test.sh:ro
      # Mount current repository so E2E validates local changes instead of GitHub HEAD
      - ../:/workspace:ro
      # Preserve test results
      - ./results:/test-results
    working_dir: /root
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        # Use mainland China mirrors to reduce package download latency in CN networks
        cat > /etc/pacman.d/mirrorlist <<'EOF'
        Server = https://mirrors.tuna.tsinghua.edu.cn/archlinux/$$repo/os/$$arch
        Server = https://mirrors.ustc.edu.cn/archlinux/$$repo/os/$$arch
        Server = https://mirrors.cernet.edu.cn/archlinux/$$repo/os/$$arch
        Server = https://mirror.sjtu.edu.cn/archlinux/$$repo/os/$$arch
        EOF

        sed -i 's/^#ParallelDownloads = .*/ParallelDownloads = 5/' /etc/pacman.conf

        # Initialize Arch Linux keyring
        echo "==> Initializing Arch Linux keyring..."
        rm -rf /etc/pacman.d/gnupg
        pacman-key --init
        pacman-key --populate archlinux

        # Update package database
        echo "==> Updating package database..."
        pacman -Sy

        # Install required packages
        echo "==> Installing required packages..."
        pacman -S --noconfirm git curl bash sudo shadow neovim

        echo "==> Environment ready"
        echo "==> Bash: $$(bash --version | head -1)"
        echo "==> Git: $$(git --version | head -1)"
        echo "==> Curl: $$(curl --version | head -1)"
        echo ""

        # Run the test script
        if [ -f /usr/local/bin/run-e2e-test.sh ]; then
          echo "==> Starting dotfile test..."
          exec /usr/local/bin/run-e2e-test.sh
        else
          echo "Test script not found, starting shell..."
          exec /bin/bash
        fi
